name:  Build Potomitan Kreyol Keyboard - Detailed Steps

permissions:
  contents: write
  packages: write

on:
  push:
    branches: [ main ]
    paths:
      - 'android_keyboard/**'
      - '.github/workflows/**'
      - 'Dictionnaires/**'
      # RAPPORT_LINGUISTIQUE.md est une analyse du corpus, pas une entrée de
      # build : rien de ce qu'il contient ne part dans l'APK ni dans l'AAB. Le
      # workflow rapport-corpus.yml le régénère à chaque évolution du dataset,
      # et cette exclusion garantit qu'un rafraîchissement de la page
      # docs/corpus.html ne déclenche aucun build. Les motifs sont évalués dans
      # l'ordre : la négation ne retire que ce fichier de 'Dictionnaires/**',
      # un commit touchant aussi KreyolComplet.py déclenche bien le build.
      - '!Dictionnaires/RAPPORT_LINGUISTIQUE.md'
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
    paths:
      - 'android_keyboard/**'
      - 'Dictionnaires/**'
      - '!Dictionnaires/RAPPORT_LINGUISTIQUE.md'
  workflow_dispatch:

jobs:
  # 📊 ÉTAPE 1 : GÉNÉRATION DICTIONNAIRE
  generate-dictionary:
    name: 🔤 Generate Kreyòl Dictionary
    runs-on: ubuntu-latest
    
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      
    outputs:
      dict-count: ${{ steps.stats.outputs.dict-count }}
      ngrams-count: ${{ steps.stats.outputs.ngrams-count }}

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5

    - name: 🐍 Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: 📦 Generate Fresh Kreyòl Dictionary
      run: |
        echo "🔄 Generating fresh Kreyòl dictionary from Hugging Face..."
        echo "🔑 Token configuré: $(if [ -n "$HF_TOKEN" ]; then echo "✅ Oui"; else echo "❌ Non"; fi)"
        
        cd Dictionnaires
        echo "📁 Contenu avant génération:"
        ls -la
        
        python -m pip install --upgrade pip
        pip install datasets huggingface_hub
        
        echo "🚀 Lancement du script Python..."
        python KreyolComplet.py

        # Fraz a twou, le jeu de phrases à trous, consomme le dictionnaire et les
        # n-grammes
        # qui viennent d'être écrits : il doit tourner APRÈS le pipeline,
        # jamais avant, sinon ses leurres sont tirés d'un modèle périmé et
        # ClozeAssetTest voit ses réponses sortir du dictionnaire livré.
        #
        # Sans --strict, volontairement : KreyolComplet.py se replie en silence
        # sur l'instantané local quand Hugging Face est injoignable, et le
        # build continue. Faire échouer le seul jeu à trous dans ce cas
        # transformerait une panne de HF en build rouge, alors que le reste de
        # la chaîne l'absorbe. Le garde-fou de volume, plus bas, arrête quand
        # même le build si la génération produit un fichier vide ou tronqué.
        echo "🕳️ Génération du jeu Fraz a twou..."
        python generate_cloze.py

        # La table de gloses consomme elle aussi le dictionnaire qui vient
        # d'être écrit, et doit donc tourner après lui. Elle ne dépend pas de
        # Hugging Face mais de deux sources publiques, Kreyolopedia et le
        # Wiktionnaire, sans jeton ni compte.
        #
        # Sans --strict pour la même raison que ci-dessus : une indisponibilité
        # de l'une des deux ne doit pas rendre le build rouge. Le script se
        # replie alors sur son cache, ou échoue proprement s'il n'en a pas, et
        # c'est le garde-fou de volume plus bas qui arrête le build.
        echo "📖 Génération de la table de traductions..."
        python generate_translations.py
        
        echo "📁 Contenu après génération:"
        ls -la
        
        echo "🔍 Vérification fichiers JSON générés dans clavier_creole/assets/:"
        ls -la ../clavier_creole/assets/creole_*.json || echo "❌ Aucun fichier JSON trouvé dans clavier_creole/assets/"

    - name: 📊 Verify Generated Assets
      run: |
        echo "� Vérification des fichiers générés..."
        
        # Le script Python génère directement dans clavier_creole/assets/
        if [ ! -f "clavier_creole/assets/creole_dict.json" ]; then
          echo "❌ ERREUR: creole_dict.json manquant dans clavier_creole/assets/!"
          echo "📁 Contenu du dossier clavier_creole/assets/:"
          ls -la clavier_creole/assets/ || echo "Dossier inexistant"
          echo "📁 Contenu du dossier Dictionnaires:"
          ls -la Dictionnaires/
          exit 1
        fi
        
        if [ ! -f "clavier_creole/assets/creole_ngrams.json" ]; then
          echo "❌ ERREUR: creole_ngrams.json manquant dans clavier_creole/assets/!"
          echo "📁 Contenu du dossier clavier_creole/assets/:"
          ls -la clavier_creole/assets/ || echo "Dossier inexistant"
          exit 1
        fi
        
        echo "✅ Fichiers générés avec succès dans clavier_creole/assets/!"
        echo "📊 Tailles des fichiers:"
        ls -lh clavier_creole/assets/creole_*.json

    - name: 📈 Dictionary Statistics
      id: stats
      run: |
        # Statistiques directement depuis clavier_creole/assets/ où le script génère
        DICT_COUNT=$(jq 'length' clavier_creole/assets/creole_dict.json)
        NGRAMS_COUNT=$(jq 'length' clavier_creole/assets/creole_ngrams.json)
        echo "📊 Dictionary: $DICT_COUNT words, $NGRAMS_COUNT N-grams"
        echo "dict-count=$DICT_COUNT" >> $GITHUB_OUTPUT
        echo "ngrams-count=$NGRAMS_COUNT" >> $GITHUB_OUTPUT

    - name: 🎯 Verify Android Assets Written by the Script
      run: |
        # KreyolComplet.py écrit déjà directement les deux formats corrects :
        # clavier_creole/assets/creole_dict.json en objet {mot: fréquence} (Flutter),
        # android_keyboard/app/src/main/assets/creole_dict.json en tableau [[mot, fréquence], ...]
        # (format attendu par JSONArray(...) dans SuggestionEngine.kt). Un `cp` du premier
        # vers le second écrasait ici le format Android correct par le format objet Flutter :
        # JSONArray(...) plantait silencieusement au chargement (JSONException non catchée),
        # désactivant toutes les suggestions sur les APK/AAB publiés (constaté sur la
        # release v10.2.6). Ne plus copier depuis clavier_creole/ : seulement vérifier.
        echo "📊 Vérification des assets Android déjà générés par le script:"
        ls -la android_keyboard/app/src/main/assets/creole_*.json

        # Garde-fou anti-régression : creole_dict.json DOIT être un tableau
        # [[mot, fréquence], ...], jamais un objet {mot: fréquence}. Un objet
        # se parse en JSONException au runtime (non catchée avant le fix de
        # SuggestionEngine.kt) et désactive silencieusement toutes les
        # suggestions sur l'APK publié — exactement le bug de la v10.2.6.
        if ! jq -e 'type == "array"' android_keyboard/app/src/main/assets/creole_dict.json > /dev/null; then
          echo "::error::creole_dict.json n'est PAS un tableau [[mot, fréquence], ...] — c'est le bug qui a cassé les suggestions en v10.2.6. Build arrêté avant de publier un APK cassé."
          exit 1
        fi
        echo "✅ Format de creole_dict.json vérifié : tableau de paires [mot, fréquence]"

        # Fraz a twou n'a pas de repli codé en dur : sans son
        # actif, ClozeFragment affiche un écran qui dit que les phrases n'ont
        # pas pu être chargées. Un fichier vide ou tronqué ne casse donc rien
        # visiblement au build, et le jeu part cassé.
        CLOZE_COUNT=$(jq '.items | length' android_keyboard/app/src/main/assets/creole_cloze.json)
        echo "🕳️ Questions de Fraz a twou : $CLOZE_COUNT"
        if [ "$CLOZE_COUNT" -lt 250 ]; then
          echo "::error::Seulement $CLOZE_COUNT questions dans creole_cloze.json — une manche fait 10 questions par difficulté. Lancez Dictionnaires/generate_cloze.py"
          exit 1
        fi

        # Les phrases livrées sont des extraits d'œuvres d'auteurs identifiés :
        # l'attribution voyage dans le fichier, et le jeu l'affiche.
        if ! jq -e '.sources | length > 0' android_keyboard/app/src/main/assets/creole_cloze.json > /dev/null; then
          echo "::error::creole_cloze.json ne porte pas l'attribution de son corpus."
          exit 1
        fi

        # La table de gloses décide de ce que les quatre jeux font chercher :
        # ils ne tirent que parmi les mots traduits. Une table tronquée ne
        # casse rien visiblement — le filtre se replie sur le dictionnaire
        # entier — mais les jeux repartent muets.
        TRAD_COUNT=$(jq '.translations | length' android_keyboard/app/src/main/assets/creole_translations.json)
        echo "📖 Formes traduites : $TRAD_COUNT"
        if [ "$TRAD_COUNT" -lt 800 ]; then
          echo "::error::Seulement $TRAD_COUNT formes dans creole_translations.json — une des deux passes du Wiktionnaire a échoué. Lancez Dictionnaires/generate_translations.py"
          exit 1
        fi

        # Kreyolopedia et le Wiktionnaire sont en CC BY-SA : citer la source
        # n'est pas une politesse, c'est la condition de la réutilisation.
        # L'attribution voyage dans l'actif et s'affiche en pied de l'onglet
        # Dictionnaire.
        if ! jq -e '.attribution | length > 0' android_keyboard/app/src/main/assets/creole_translations.json > /dev/null; then
          echo "::error::creole_translations.json ne porte pas l'attribution de ses sources — CC BY-SA l'exige."
          exit 1
        fi

    - name: 🎯 Dictionary Assets Ready
      run: |
        echo "✅ Assets de dictionnaire prêts pour les builds Android"
        echo "� Statistiques finales:"
        DICT_COUNT=$(jq 'length' android_keyboard/app/src/main/assets/creole_dict.json)
        NGRAMS_COUNT=$(jq 'length' android_keyboard/app/src/main/assets/creole_ngrams.json)
        CLOZE_COUNT=$(jq '.items | length' android_keyboard/app/src/main/assets/creole_cloze.json)
        TRAD_COUNT=$(jq '.translations | length' android_keyboard/app/src/main/assets/creole_translations.json)
        echo "   - Mots: $DICT_COUNT"
        echo "   - N-grams: $NGRAMS_COUNT"
        echo "   - Phrases à trous: $CLOZE_COUNT"
        echo "   - Formes traduites: $TRAD_COUNT"
        echo "� Fichiers disponibles pour tous les jobs de build"

    # 🔧 FIX CRITIQUE : sans cet upload, chaque job de build ci-dessous fait son
    # propre "actions/checkout" et récupère donc la version du dictionnaire
    # committée dans git (figée au dernier commit), jamais celle régénérée
    # ci-dessus depuis Hugging Face. Le "needs: generate-dictionary" garantit
    # seulement l'ordre d'exécution, pas le partage de fichiers entre jobs.
    - name: 📤 Upload Fresh Dictionary Assets
      uses: actions/upload-artifact@v6
      with:
        name: kreyol-dictionary-assets
        path: |
          android_keyboard/app/src/main/assets/creole_dict.json
          android_keyboard/app/src/main/assets/creole_ngrams.json
          android_keyboard/app/src/main/assets/creole_cloze.json
          android_keyboard/app/src/main/assets/creole_translations.json
        retention-days: 1

  # 🔧 ÉTAPE 2A : BUILD DEBUG APK
  build-debug-apk:
    name: 🔧 Build Debug APK
    runs-on: ubuntu-latest
    needs: generate-dictionary

    env:
      KEYSTORE_FILE: potomitan-keystore.jks
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5

    - name: 📥 Download Fresh Dictionary Assets
      uses: actions/download-artifact@v7
      with:
        name: kreyol-dictionary-assets
        path: android_keyboard/app/src/main/assets/

    - name: ☕ Setup JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: 🔧 Setup Gradle
      uses: gradle/actions/setup-gradle@v5
      with:
        gradle-version: 9.6.1
        cache-read-only: false

    - name: ✅ Verify Dictionary Assets Present
      run: |
        echo "🔍 Vérification des assets de dictionnaire..."
        if [ -f "android_keyboard/app/src/main/assets/creole_dict.json" ]; then
          echo "✅ creole_dict.json présent"
        else
          echo "❌ creole_dict.json manquant"
          exit 1
        fi
        
        if [ -f "android_keyboard/app/src/main/assets/creole_ngrams.json" ]; then
          echo "✅ creole_ngrams.json présent"
        else
          echo "❌ creole_ngrams.json manquant"
          exit 1
        fi
        
        echo "📊 Tailles des fichiers:"
        ls -lh android_keyboard/app/src/main/assets/creole_*.json

    - name: 🧹 Clean Project
      env:
        GRADLE_OPTS: "-Dorg.gradle.buildscan.termsOfServiceUrl=https://gradle.com/terms-of-service -Dorg.gradle.buildscan.termsOfServiceAgree=yes"
      run: cd android_keyboard && gradle clean --no-daemon --scan

    - name: 🔨 Build Debug APK
      env:
        GRADLE_OPTS: "-Dorg.gradle.buildscan.termsOfServiceUrl=https://gradle.com/terms-of-service -Dorg.gradle.buildscan.termsOfServiceAgree=yes"
      run: cd android_keyboard && gradle assembleDebug --no-daemon --scan

    - name: 📤 Upload Debug APK
      uses: actions/upload-artifact@v6
      with:
        name: kreyol-keyboard-debug-apk
        path: android_keyboard/app/build/outputs/apk/debug/*.apk
        retention-days: 7

  # 📦 ÉTAPE 2B : BUILD DEBUG AAB  
  build-debug-aab:
    name: 📦 Build Debug AAB
    runs-on: ubuntu-latest
    needs: generate-dictionary

    env:
      KEYSTORE_FILE: potomitan-keystore.jks
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5

    - name: 📥 Download Fresh Dictionary Assets
      uses: actions/download-artifact@v7
      with:
        name: kreyol-dictionary-assets
        path: android_keyboard/app/src/main/assets/

    - name: ☕ Setup JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: 🔧 Setup Gradle
      uses: gradle/actions/setup-gradle@v5
      with:
        gradle-version: 9.6.1
        cache-read-only: false

    - name: ✅ Verify Dictionary Assets Present
      run: |
        echo "🔍 Vérification des assets de dictionnaire..."
        ls -lh android_keyboard/app/src/main/assets/creole_*.json || echo "❌ Fichiers dictionnaire manquants"

    - name: 📦 Build Debug AAB
      env:
        GRADLE_OPTS: "-Dorg.gradle.buildscan.termsOfServiceUrl=https://gradle.com/terms-of-service -Dorg.gradle.buildscan.termsOfServiceAgree=yes"
      run: cd android_keyboard && gradle bundleDebug --no-daemon --scan

    - name: 📤 Upload Debug AAB
      uses: actions/upload-artifact@v6
      with:
        name: kreyol-keyboard-debug-aab
        path: android_keyboard/app/build/outputs/bundle/debug/*.aab
        retention-days: 7

  # 🚀 ÉTAPE 3A : BUILD RELEASE APK
  build-release-apk:
    name: 🚀 Build Release APK
    runs-on: ubuntu-latest
    needs: generate-dictionary

    env:
      KEYSTORE_FILE: potomitan-keystore.jks
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5

    - name: 📥 Download Fresh Dictionary Assets
      uses: actions/download-artifact@v7
      with:
        name: kreyol-dictionary-assets
        path: android_keyboard/app/src/main/assets/

    - name: ☕ Setup JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: 🔧 Setup Gradle
      uses: gradle/actions/setup-gradle@v5
      with:
        gradle-version: 9.6.1
        cache-read-only: false

    - name: ✅ Verify Dictionary Assets Present
      run: |
        echo "🔍 Vérification des assets de dictionnaire..."
        ls -lh android_keyboard/app/src/main/assets/creole_*.json || echo "❌ Fichiers dictionnaire manquants"

    - name: 🔐 Setup Production Keystore for Release APK
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        cd android_keyboard
        
        if [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ] && [ -n "$KEYSTORE_BASE64" ]; then
          echo "🔑 Decoding production keystore from GitHub Secrets..."
          echo "$KEYSTORE_BASE64" | base64 -d > app/$KEYSTORE_FILE
          echo "✅ Production keystore decoded: $KEYSTORE_FILE"
          echo "🔐 Release APK will be signed with production key"
          
          # Vérification du keystore
          keytool -list -v -keystore app/$KEYSTORE_FILE -alias "$KEY_ALIAS" -storepass "$STORE_PASSWORD" | grep "SHA1:" || echo "⚠️ SHA1 verification"
        else
          echo "⚠️ Production secrets not available, generating debug keystore..."
          keytool -genkey -v -keystore app/debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
        fi

    - name: 🧹 Clean Project  
      env:
        GRADLE_OPTS: "-Dorg.gradle.buildscan.termsOfServiceUrl=https://gradle.com/terms-of-service -Dorg.gradle.buildscan.termsOfServiceAgree=yes"
      run: cd android_keyboard && gradle clean --no-daemon --scan

    - name: 🚀 Build Release APK
      env:
        GRADLE_OPTS: "-Dorg.gradle.buildscan.termsOfServiceUrl=https://gradle.com/terms-of-service -Dorg.gradle.buildscan.termsOfServiceAgree=yes"
      run: cd android_keyboard && gradle assembleRelease --no-daemon --scan

    - name: 📤 Upload Release APK
      uses: actions/upload-artifact@v6
      with:
        name: kreyol-keyboard-release-apk
        path: android_keyboard/app/build/outputs/apk/release/*.apk
        retention-days: 30

  # 🎯 ÉTAPE 3B : BUILD RELEASE AAB
  build-release-aab:
    name: 🎯 Build Release AAB
    runs-on: ubuntu-latest
    needs: generate-dictionary

    env:
      KEYSTORE_FILE: potomitan-keystore.jks
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5

    - name: 📥 Download Fresh Dictionary Assets
      uses: actions/download-artifact@v7
      with:
        name: kreyol-dictionary-assets
        path: android_keyboard/app/src/main/assets/

    - name: ☕ Setup JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: 🔧 Setup Gradle
      uses: gradle/actions/setup-gradle@v5
      with:
        gradle-version: 9.6.1
        cache-read-only: false

    - name: ✅ Verify Dictionary Assets Present
      run: |
        echo "🔍 Vérification des assets de dictionnaire..."
        ls -lh android_keyboard/app/src/main/assets/creole_*.json || echo "❌ Fichiers dictionnaire manquants"

    - name: 🔐 Setup Production Keystore for Release AAB
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        cd android_keyboard
        
        if [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ] && [ -n "$KEYSTORE_BASE64" ]; then
          echo "🔑 Decoding production keystore from GitHub Secrets..."
          echo "$KEYSTORE_BASE64" | base64 -d > app/$KEYSTORE_FILE
          echo "✅ Production keystore decoded: $KEYSTORE_FILE"
          echo "🏪 Release AAB will be signed for Google Play Store"
          
          # Vérification du keystore
          keytool -list -v -keystore app/$KEYSTORE_FILE -alias "$KEY_ALIAS" -storepass "$STORE_PASSWORD" | grep "SHA1:" || echo "⚠️ SHA1 verification"
        else
          echo "⚠️ Production secrets not available, generating debug keystore..."
          keytool -genkey -v -keystore app/debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
        fi

    - name: 🎯 Build Release AAB
      env:
        GRADLE_OPTS: "-Dorg.gradle.buildscan.termsOfServiceUrl=https://gradle.com/terms-of-service -Dorg.gradle.buildscan.termsOfServiceAgree=yes"
      run: cd android_keyboard && gradle bundleRelease --no-daemon --scan

    - name: Verify AAB Signature
      run: |
        cd android_keyboard
        echo "🔍 Verifying AAB signature..."
        AAB_FILE="app/build/outputs/bundle/release/app-release.aab"
        
        if [ -f "$AAB_FILE" ]; then
          echo "✅ AAB found: $AAB_FILE"
          echo ""
          echo "📊 AAB Details:"
          ls -lh "$AAB_FILE"
          echo ""
          echo "🔐 Certificate Information:"
          jarsigner -verify -verbose -certs "$AAB_FILE" | grep "CN=" | head -1
          echo ""
          echo "🔑 SHA Fingerprints:"
          keytool -printcert -jarfile "$AAB_FILE" 2>&1 | grep "SHA" || echo "Unable to extract SHA via keytool"
          echo ""
          echo "✅ AAB is ready for Google Play Console upload"
        else
          echo "❌ AAB not found at $AAB_FILE"
          exit 1
        fi

    - name: Upload Release AAB
      uses: actions/upload-artifact@v6
      with:
        name: kreyol-keyboard-release-aab  
        path: android_keyboard/app/build/outputs/bundle/release/*.aab
        retention-days: 30

  # 📱 ÉTAPE 4 : VALIDATION & TESTS
  validate-builds:
    name: 🔍 Validate Builds
    runs-on: ubuntu-latest
    needs: [build-debug-apk, build-debug-aab, build-release-apk, build-release-aab]
    
    steps:
    - name: 📥 Download All Artifacts
      uses: actions/download-artifact@v7
      with:
        path: ./all-builds

    - name: 📊 Build Summary
      run: |
        echo "🎯 BUILD VALIDATION SUMMARY"
        echo "=========================="
        
        find ./all-builds -name "*.apk" -o -name "*.aab" | while read file; do
          echo "📱 $(basename "$file"): $(stat -f%z "$file" 2>/dev/null || stat -c%s "$file") bytes"
        done

    - name: ✅ Mark Builds Valid
      run: echo "✅ All builds completed successfully!"

  # 🎉 ÉTAPE 5 : CRÉATION RELEASE (si tag)
  create-release:
    name: 🎉 Create Release
    runs-on: ubuntu-latest
    needs: [generate-dictionary, validate-builds]
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5
      
    - name: 📝 Extract Release Notes from CHANGELOG
      id: changelog
      run: |
        echo "📖 Extraction des notes de release depuis android_keyboard/CHANGELOG.md..."

        # Garde-fou : la section en tête du CHANGELOG doit correspondre au tag
        # poussé, sinon ce sont les notes d'une version précédente qui seraient
        # publiées en silence (vécu sur v10.2.1 et v10.2.3, jamais détecté)
        TAG_VERSION="${GITHUB_REF_NAME#v}"
        CHANGELOG_VERSION=$(sed -n 's/^## \[\(.*\)\].*/\1/p' android_keyboard/CHANGELOG.md | head -1)

        echo "🏷️  Tag poussé: $GITHUB_REF_NAME (version $TAG_VERSION)"
        echo "📄 Version en tête du CHANGELOG: $CHANGELOG_VERSION"

        if [ "$TAG_VERSION" != "$CHANGELOG_VERSION" ]; then
          echo "::error::La section en tête de android_keyboard/CHANGELOG.md ([$CHANGELOG_VERSION]) ne correspond pas au tag poussé ($GITHUB_REF_NAME). Ajoutez une entrée '## [$TAG_VERSION]' dans le CHANGELOG avant de tagger."
          exit 1
        fi

        # Extraire la section de la version actuelle du CHANGELOG
        # On prend tout depuis le premier ## jusqu'au prochain ## ou fin de fichier
        RELEASE_NOTES=$(awk '/^## / {if (found) exit; found=1; next} found' android_keyboard/CHANGELOG.md | sed '/^## /q' | sed '$d')
        
        # Si le CHANGELOG n'a pas de contenu, utiliser un message par défaut
        if [ -z "$RELEASE_NOTES" ]; then
          RELEASE_NOTES="🎯 Nouvelle version du Clavier Kreyòl Potomitan
          
          Consultez le CHANGELOG.md complet pour tous les détails des améliorations."
        fi
        
        # Sauvegarder dans un fichier pour utilisation ultérieure
        echo "$RELEASE_NOTES" > /tmp/release-notes.md
        
        echo "✅ Notes de release extraites avec succès"
        echo "📄 Aperçu des notes:"
        head -20 /tmp/release-notes.md
    
    - name: 📥 Download All Build Artifacts
      uses: actions/download-artifact@v7
      with:
        pattern: kreyol-keyboard-*
        path: ./all-artifacts

    - name: 📎 Prepare All Release Assets with Custom Names
      run: |
        echo "📁 Préparation de tous les assets pour release..."
        mkdir -p ./final-release-assets
        
        echo "🔍 Contenu complet des artifacts téléchargés:"
        find ./all-artifacts -type f -name "*.apk" -o -name "*.aab"
        
        echo "📁 Structure des dossiers artifacts:"
        ls -la ./all-artifacts/
        
        # 📱 APK RELEASE - Detection automatique
        RELEASE_APK=$(find ./all-artifacts/kreyol-keyboard-release-apk -name "*.apk" | head -1)
        if [ -n "$RELEASE_APK" ] && [ -f "$RELEASE_APK" ]; then
          cp "$RELEASE_APK" "./final-release-assets/KreyolKeyboard-Release-${{ github.ref_name }}.apk"
          echo "✅ APK Release: KreyolKeyboard-Release-${{ github.ref_name }}.apk (source: $(basename $RELEASE_APK))"
        else
          echo "❌ APK release non trouvé"
          echo "📁 Contenu dossier release APK:"
          ls -la ./all-artifacts/kreyol-keyboard-release-apk/ || echo "Dossier APK release inexistant"
          echo "🔍 Recherche de fichiers APK:"
          find ./all-artifacts/kreyol-keyboard-release-apk -name "*.apk" || echo "Aucun fichier APK trouvé"
        fi
        
        # 🔧 APK DEBUG - Detection automatique  
        DEBUG_APK=$(find ./all-artifacts/kreyol-keyboard-debug-apk -name "*.apk" | head -1)
        if [ -n "$DEBUG_APK" ] && [ -f "$DEBUG_APK" ]; then
          cp "$DEBUG_APK" "./final-release-assets/KreyolKeyboard-Debug-${{ github.ref_name }}.apk"
          echo "✅ APK Debug: KreyolKeyboard-Debug-${{ github.ref_name }}.apk (source: $(basename $DEBUG_APK))"
        else
          echo "❌ APK debug non trouvé"
          echo "📁 Contenu dossier debug APK:"
          ls -la ./all-artifacts/kreyol-keyboard-debug-apk/ || echo "Dossier APK debug inexistant"
          echo "🔍 Recherche de fichiers APK:"
          find ./all-artifacts/kreyol-keyboard-debug-apk -name "*.apk" || echo "Aucun fichier APK trouvé"
        fi
        
        # 📦 AAB RELEASE - Detection automatique
        RELEASE_AAB=$(find ./all-artifacts/kreyol-keyboard-release-aab -name "*.aab" | head -1)
        if [ -n "$RELEASE_AAB" ] && [ -f "$RELEASE_AAB" ]; then
          cp "$RELEASE_AAB" "./final-release-assets/KreyolKeyboard-Release-${{ github.ref_name }}.aab"
          echo "✅ AAB Release: KreyolKeyboard-Release-${{ github.ref_name }}.aab (source: $(basename $RELEASE_AAB))"
        else
          echo "❌ AAB release non trouvé"
          echo "📁 Contenu dossier release AAB:"
          ls -la ./all-artifacts/kreyol-keyboard-release-aab/ || echo "Dossier AAB release inexistant"
          echo "🔍 Recherche de fichiers AAB:"
          find ./all-artifacts/kreyol-keyboard-release-aab -name "*.aab" || echo "Aucun fichier AAB trouvé"
        fi
        
        # 🔧 AAB DEBUG - Detection automatique
        DEBUG_AAB=$(find ./all-artifacts/kreyol-keyboard-debug-aab -name "*.aab" | head -1)
        if [ -n "$DEBUG_AAB" ] && [ -f "$DEBUG_AAB" ]; then
          cp "$DEBUG_AAB" "./final-release-assets/KreyolKeyboard-Debug-${{ github.ref_name }}.aab"
          echo "✅ AAB Debug: KreyolKeyboard-Debug-${{ github.ref_name }}.aab (source: $(basename $DEBUG_AAB))"
        else
          echo "❌ AAB debug non trouvé"
          echo "📁 Contenu dossier debug AAB:"
          ls -la ./all-artifacts/kreyol-keyboard-debug-aab/ || echo "Dossier AAB debug inexistant"
          echo "🔍 Recherche de fichiers AAB:"
          find ./all-artifacts/kreyol-keyboard-debug-aab -name "*.aab" || echo "Aucun fichier AAB trouvé"
        fi
        
        echo ""
        echo "📊 ASSETS FINAUX PRÉPARÉS:"
        ls -la ./final-release-assets/
        echo ""
        echo "📝 RÉSUMÉ:"
        find ./final-release-assets -name "*.apk" -o -name "*.aab" | while read file; do
          size=$(stat -c%s "$file" 2>/dev/null || stat -f%z "$file" 2>/dev/null || echo "0")
          echo "  📱 $(basename "$file"): ${size} bytes"
        done

    - name: 🎉 Create GitHub Release with Assets
      id: create_release
      uses: softprops/action-gh-release@v3
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref_name }}
        name:  Kreyòl Keyboard ${{ github.ref_name }}
        body_path: /tmp/release-notes.md
        draft: false
        prerelease: false
        make_latest: true
        files: ./final-release-assets/*
        
    - name: 📊 Add Build Statistics to Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo "📊 Ajout des statistiques de build à la release..."
        
        # Créer un commentaire avec les statistiques techniques
        STATS_COMMENT="
        
        ---
        
        ## 📊 Statistiques de Build
        
        🔤 **DICTIONNAIRE KREYÒL**
        - ✅ **${{ needs.generate-dictionary.outputs.dict-count }}** mots créoles
        - 🧠 **${{ needs.generate-dictionary.outputs.ngrams-count }}** N-grams prédictifs
        - 📡 Synchronisation automatique Hugging Face
        
        📱 **FICHIERS DISPONIBLES**
        - 📱 **APK Release** - Installation directe (recommandé pour utilisateurs finaux)
        - 🔧 **APK Debug** - Version de développement avec logs détaillés
        - 🏪 **AAB Release** - Bundle Google Play Store (distribution officielle)
        - 🛠️ **AAB Debug** - Bundle de développement pour tests
        
        � **Build Scan Reports** - Consultez les rapports détaillés dans les logs GitHub Actions
        
        ---
        
         **Kreyòl Gwadloup ka viv!** 
        "
        
        # Ajouter le commentaire à la release existante
        gh release edit "${{ github.ref_name }}" --notes-file /tmp/release-notes.md --notes "$STATS_COMMENT" || echo "⚠️ Impossible d'ajouter les statistiques (release peut-être déjà complète)"