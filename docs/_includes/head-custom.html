<!-- Favicon personnalisé pour Klavyé Kréyòl Karukera -->
<link rel="icon" type="image/x-icon" href="{{ '/favicon.ico' | relative_url }}">
<link rel="shortcut icon" type="image/x-icon" href="{{ '/favicon.ico' | relative_url }}">

<!-- Thème clair/sombre : palette guadeloupéenne + bascule manuelle -->
<link rel="stylesheet" href="{{ '/assets/theme.css' | relative_url }}">
<script>(function(){var t=localStorage.getItem('kreyol-theme');if(t)document.documentElement.setAttribute('data-theme',t);})();</script>
<script defer src="{{ '/assets/theme.js' | relative_url }}"></script>

<!-- Aperçu de partage. Le thème de GitHub Pages (jekyll-seo-tag) écrit déjà
     og:title, og:description, og:url et twitter:card à partir de l'en-tête
     de la page ; une page qui déclare `image:` y gagne l'image et la grande
     vignette, comme l'accueil de LuxKeyb. Ces balises-ci ne viennent qu'en
     repli, pour les pages sans `image:` : réécrire og:title à la suite
     doublait chaque balise, et la plupart des réseaux gardent la première. -->
{% unless page.image %}
<meta property="og:image" content="https://famibelle.github.io/KreyolKeyb/assets/og/partage.png">
<meta property="twitter:image" content="https://famibelle.github.io/KreyolKeyb/assets/og/partage.png">
{% endunless %}
